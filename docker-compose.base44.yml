services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./generative_ui_agents/generative-ui-starter-project:/app
    ports:
      - "3000:3000"
    environment:
      - AGENT_URL=http://agent:8123
      - BASE44_PUBLIC_HOST_SUFFIX
      - NODE_OPTIONS=--max-old-space-size=4096
    command:
      [
        "sh",
        "-ec",
        "npm install --ignore-scripts && exec npx next dev --turbopack --hostname 0.0.0.0 --port 3000",
      ]
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
        "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))",
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: on-failure

  agent:
    image: python:3.12-slim
    working_dir: /app/agent
    volumes:
      - ./generative_ui_agents/generative-ui-starter-project:/app
    ports:
      - "8123:8123"
    env_file:
      - /run/base44/app.env
    command:
      [
        "sh",
        "-ec",
        "pip install --no-cache-dir uv && uv sync && printf 'OPENAI_API_KEY=%s\\n' \"$OPENAI_API_KEY\" > /app/.env && exec uv run langgraph dev --port 8123 --no-browser --host 0.0.0.0",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
        "import urllib.request;urllib.request.urlopen('http://localhost:8123/ok')",
      ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: on-failure
